name: Local Agent Browser Formatter

on:
  pull_request:
    branches: [ feature/mcp-v1-2-optimization ]
    paths:
      - 'chrome-extension/manifest.js'
      - 'chrome-extension/src/background/local-agent-native.ts'
      - '.github/workflows/format-local-agent-browser.yml'

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feature/local-agent-cpp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Apply canonical formatting
        run: pnpm exec prettier --write chrome-extension/manifest.js chrome-extension/src/background/local-agent-native.ts
      - name: Commit formatting if changed
        shell: bash
        env:
          HUSKY: '0'
        run: |
          set -euo pipefail
          if git diff --quiet -- chrome-extension/manifest.js chrome-extension/src/background/local-agent-native.ts; then
            echo 'Formatting already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chrome-extension/manifest.js chrome-extension/src/background/local-agent-native.ts
          git commit -m 'style(local-agent): format browser native bridge'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
