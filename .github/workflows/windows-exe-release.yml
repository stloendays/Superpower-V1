name: Windows EXE Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-windows-exe:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: exe')
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build extension
        run: pnpm build

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Verify built extension version
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $builtVersion = node -p "require('./dist/manifest.json').version"
          if ($builtVersion -ne $version) {
            throw "Built manifest version $builtVersion does not match package version $version."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer EXE
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $iscc = Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) {
            throw 'ISCC.exe was not found after installing Inno Setup.'
          }
          & $iscc "/DMyAppVersion=$version" 'installer\Superpower.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Package portable release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $packageDir = "release\Superpower-$version"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          Copy-Item -Recurse -Force dist "$packageDir\dist"
          Copy-Item Install-Superpower.cmd, DIY-Install-Superpower.ps1, LICENSE $packageDir
          Copy-Item RELEASE_INSTALL.md "$packageDir\README_INSTALL.md"
          Compress-Archive -Path $packageDir -DestinationPath "release\Superpower-$version-Windows.zip" -Force
          $files = @(
            "release\Superpower-$version-Setup.exe",
            "release\Superpower-$version-Windows.zip"
          )
          foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            "$hash  $([IO.Path]::GetFileName($file))" | Add-Content -Path release\SHA256SUMS.txt
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Superpower-${{ steps.version.outputs.version }}-Windows-Release
          path: |
            release/Superpower-${{ steps.version.outputs.version }}-Setup.exe
            release/Superpower-${{ steps.version.outputs.version }}-Windows.zip
            release/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Superpower v${{ steps.version.outputs.version }} Windows
          generate_release_notes: true
          make_latest: true
          files: |
            release/Superpower-${{ steps.version.outputs.version }}-Setup.exe
            release/Superpower-${{ steps.version.outputs.version }}-Windows.zip
            release/SHA256SUMS.txt
