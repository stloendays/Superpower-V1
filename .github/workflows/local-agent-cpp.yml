name: Local Agent C++

on:
  pull_request:
    paths:
      - 'native/superpower-local-agent/**'
      - 'chrome-extension/manifest.ts'
      - 'chrome-extension/manifest.js'
      - 'chrome-extension/package.json'
      - 'chrome-extension/src/background-entry.ts'
      - 'chrome-extension/src/background/local-agent-native.ts'
      - 'chrome-extension/vite.config.mts'
      - 'pages/content/src/core/local-agent-client.ts'
      - 'pages/content/src/services/assistant-message-mirror.service.ts'
      - 'pages/content/src/services/desktop-gui.service.ts'
      - 'pages/content/src/services/index.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/local-agent-cpp.yml'
  push:
    branches:
      - feature/local-agent-cpp
    paths:
      - 'native/superpower-local-agent/**'
      - 'chrome-extension/manifest.ts'
      - 'chrome-extension/manifest.js'
      - 'chrome-extension/package.json'
      - 'chrome-extension/src/background-entry.ts'
      - 'chrome-extension/src/background/local-agent-native.ts'
      - 'chrome-extension/vite.config.mts'
      - 'pages/content/src/core/local-agent-client.ts'
      - 'pages/content/src/services/assistant-message-mirror.service.ts'
      - 'pages/content/src/services/desktop-gui.service.ts'
      - 'pages/content/src/services/index.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/local-agent-cpp.yml'

concurrency:
  group: local-agent-cpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Detect installed Chrome major
        id: chrome-major
        shell: pwsh
        run: |
          $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          if (-not (Test-Path -LiteralPath $chrome -PathType Leaf)) {
            throw "Runner Chrome was not found at $chrome"
          }
          $version = (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          $major = $version.Split('.')[0]
          if ($major -notmatch '^\d+$') {
            throw "Could not parse Chrome major version from $version"
          }
          Write-Host "Runner Chrome version: $version; installing Chrome for Testing milestone $major"
          "major=$major" >> $env:GITHUB_OUTPUT

      - name: Install matching Chrome for Testing
        id: chrome-for-testing
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: ${{ steps.chrome-major.outputs.major }}

      - name: Verify Chrome for Testing
        shell: pwsh
        run: |
          $chromeForTesting = '${{ steps.chrome-for-testing.outputs.chrome-path }}'
          if (-not (Test-Path -LiteralPath $chromeForTesting -PathType Leaf)) {
            throw "Chrome for Testing was not found at $chromeForTesting"
          }
          & $chromeForTesting --version

      - name: Restore Qt cache
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt\6.8.3\msvc2022_64
          key: qt-windows-6.8.3-msvc2022-x64-v1

      - name: Install Qt 6.8.3
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O C:\Qt

      - name: Install browser workspace dependencies
        shell: pwsh
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Configure C++ Local Agent
        shell: pwsh
        run: |
          cmake -S native/superpower-local-agent -B build/local-agent -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH=C:/Qt/6.8.3/msvc2022_64

      - name: Build C++ Local Agent
        shell: pwsh
        run: cmake --build build/local-agent --config Release --parallel

      - name: Core smoke test
        shell: pwsh
        run: |
          $env:PATH = "C:\Qt\6.8.3\msvc2022_64\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = 'C:\Qt\6.8.3\msvc2022_64\plugins'
          ctest --test-dir build/local-agent -C Release --output-on-failure

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $qtBin = 'C:\Qt\6.8.3\msvc2022_64\bin'
          & "$qtBin\windeployqt.exe" --release --no-translations build/local-agent/Release/superpower-local-agent.exe
          & "$qtBin\windeployqt.exe" --release --no-translations build/local-agent/Release/superpower-local-gui.exe

      - name: Build real Superpower browser extension
        shell: pwsh
        run: pnpm build

      - name: Real Chrome Native Messaging integration
        shell: pwsh
        run: |
          & native/superpower-local-agent/tests/run_chrome_integration.ps1 `
            -ExtensionDir dist `
            -HostExe build/local-agent/Release/superpower-local-agent.exe `
            -GuiExe build/local-agent/Release/superpower-local-gui.exe `
            -ChromeExe '${{ steps.chrome-for-testing.outputs.chrome-path }}'

      - uses: actions/upload-artifact@v4
        with:
          name: superpower-local-agent-windows
          path: build/local-agent/Release/
          if-no-files-found: error
