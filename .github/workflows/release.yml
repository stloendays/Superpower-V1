name: Release Superpower

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'release: publish')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${VERSION}" != "${PACKAGE_VERSION}" ]]; then
              echo "Tag version ${VERSION} does not match package.json version ${PACKAGE_VERSION}."
              exit 1
            fi
          else
            VERSION="${PACKAGE_VERSION}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing Superpower v${VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build extension
        run: pnpm build

      - name: Verify built extension version
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          BUILT_VERSION=$(node -p "require('./dist/manifest.json').version")
          if [[ "${BUILT_VERSION}" != "${VERSION}" ]]; then
            echo "Built manifest version ${BUILT_VERSION} does not match release version ${VERSION}."
            exit 1
          fi

      - name: Prepare release package
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          PACKAGE_DIR="release/Superpower-${VERSION}"

          mkdir -p "${PACKAGE_DIR}"
          cp -r dist "${PACKAGE_DIR}/dist"
          cp Install-Superpower.cmd "${PACKAGE_DIR}/"
          cp DIY-Install-Superpower.ps1 "${PACKAGE_DIR}/"
          cp RELEASE_INSTALL.md "${PACKAGE_DIR}/README_INSTALL.md"
          cp LICENSE "${PACKAGE_DIR}/LICENSE"

          cd release
          zip -r "Superpower-${VERSION}-Windows.zip" "Superpower-${VERSION}"
          sha256sum "Superpower-${VERSION}-Windows.zip" > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Superpower v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            release/Superpower-${{ steps.version.outputs.version }}-Windows.zip
            release/SHA256SUMS
            Install-Superpower.cmd
            DIY-Install-Superpower.ps1
