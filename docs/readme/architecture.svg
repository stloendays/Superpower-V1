<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".08"/></filter></defs>
<rect width="1200" height="430" rx="28" fill="#f8fafc"/>
<text x="60" y="58" font-family="Inter,ui-sans-serif,system-ui" font-size="28" font-weight="800" fill="#0f172a">How Superpower connects the stack</text>
<text x="60" y="88" font-family="Inter,ui-sans-serif,system-ui" font-size="16" fill="#64748b">AI websites stay in the browser; MCP execution stays on your machine.</text>
<g font-family="Inter,ui-sans-serif,system-ui">
  <rect x="60" y="140" width="240" height="190" rx="22" fill="#fff" stroke="#e2e8f0"/><text x="180" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">AI web apps</text><text x="180" y="222" text-anchor="middle" font-size="15" fill="#475569">ChatGPT · Gemini</text><text x="180" y="248" text-anchor="middle" font-size="15" fill="#475569">Perplexity · Grok</text><text x="180" y="274" text-anchor="middle" font-size="15" fill="#475569">and more adapters</text>
  <rect x="350" y="140" width="240" height="190" rx="22" fill="#111827"/><text x="470" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">Superpower</text><text x="470" y="222" text-anchor="middle" font-size="15" fill="#cbd5e1">Detect tool calls</text><text x="470" y="248" text-anchor="middle" font-size="15" fill="#cbd5e1">Manage sidebar state</text><text x="470" y="274" text-anchor="middle" font-size="15" fill="#cbd5e1">Inject tool results</text>
  <rect x="640" y="140" width="220" height="190" rx="22" fill="#eef2ff" stroke="#c7d2fe"/><text x="750" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#312e81">Local MCP proxy</text><text x="750" y="222" text-anchor="middle" font-size="15" fill="#4338ca">SSE</text><text x="750" y="248" text-anchor="middle" font-size="15" fill="#4338ca">WebSocket</text><text x="750" y="274" text-anchor="middle" font-size="15" fill="#4338ca">Streamable HTTP</text>
  <rect x="910" y="140" width="230" height="190" rx="22" fill="#fff" stroke="#e2e8f0"/><text x="1025" y="185" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">MCP servers</text><text x="1025" y="222" text-anchor="middle" font-size="15" fill="#475569">Files · GitHub</text><text x="1025" y="248" text-anchor="middle" font-size="15" fill="#475569">Databases · APIs</text><text x="1025" y="274" text-anchor="middle" font-size="15" fill="#475569">Your own tools</text>
</g>
